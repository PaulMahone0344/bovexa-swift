name: Bovexa
options:
  bundleIdPrefix: com.bovexa
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
targets:
  Bovexa:
    type: application
    platform: iOS
    sources: [Bovexa]
    info:
      path: Bovexa/Info.plist
      properties:
        CFBundleDisplayName: Bovexa Flow
        CFBundleIdentifier: com.bovexa.flow-native
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSCalendarsWriteOnlyAccessUsageDescription: Bovexa Flow kan nieuwe afspraken ook in je iPhone Agenda zetten.
        NSSpeechRecognitionUsageDescription: Bovexa Flow gebruikt spraakherkenning om je planning te dicteren.
        NSMicrophoneUsageDescription: Bovexa Flow gebruikt de microfoon om je planning te dicteren.
        CFBundleURLTypes:
          - CFBundleURLName: com.bovexa.flow-native
            CFBundleURLSchemes: [bovexaflow]
    settings:
      base:
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_TEAM: R7V2WLVDDF
        CODE_SIGN_STYLE: Automatic
  BovexaTests:
    type: bundle.unit-test
    platform: iOS
    sources: [BovexaTests]
    dependencies:
      - target: Bovexa
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
schemes:
  Bovexa:
    build:
      targets:
        Bovexa: all
        BovexaTests: [test]
    test:
      targets: [BovexaTests]
